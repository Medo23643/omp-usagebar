<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06c75" />
      <stop offset="100%" stop-color="#be5046" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Badge -->
  <rect width="64" height="64" rx="14" fill="#1e1e2e" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#e06c75" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Antenna -->
  <line x1="32" y1="10" x2="32" y2="18" stroke="#e06c75" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="10" r="3.5" fill="#e06c75" />
  
  <!-- Robot Head -->
  <rect x="14" y="18" width="36" height="30" rx="7" fill="url(#robotGrad)" />
  
  <!-- Ears -->
  <rect x="9" y="27" width="5" height="12" rx="2.5" fill="#e06c75" />
  <rect x="50" y="27" width="5" height="12" rx="2.5" fill="#e06c75" />
  
  <!-- Eye Visor Screen -->
  <rect x="18" y="23" width="28" height="12" rx="4" fill="#181825" />
  
  <!-- Eyes Glowing -->
  <circle cx="25" cy="29" r="3" fill="#61afef" />
  <circle cx="39" cy="29" r="3" fill="#61afef" />
  
  <!-- Mouth Grid / Lines -->
  <line x1="24" y1="41" x2="40" y2="41" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="28" y1="39" x2="28" y2="43" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="32" y1="39" x2="32" y2="43" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="36" y1="39" x2="36" y2="43" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
